services:
  # Backend API
  - name: move-backend
    type: web
    env: node
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 8080
    healthCheckPath: /ping
    autoDeploy: true
    domains:
      - move-backend.onrender.com
    routes:
      - type: web
        methods: [GET, POST, PUT, DELETE, OPTIONS]
        pathPattern: /.*

  # Frontend estático em https://move-k987.onrender.com
  - name: move-frontend
    type: static
    buildCommand: cd frontend && yarn install && yarn build && yarn export
    publishDir: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://move-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /_next/static/*.js
        name: Content-Type
        value: application/javascript
      - path: /_next/static/*.css
        name: Content-Type
        value: text/css
      - path: /_next/static/*.woff2
        name: Content-Type
        value: font/woff2
    domains:
      - move-k987.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://move-k987.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html 
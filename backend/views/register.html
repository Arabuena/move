<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move - Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#520578'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white">
  <!-- Header com Logo -->
  <div class="bg-primary h-48 rounded-b-[40px] flex items-center justify-center">
    <h1 class="text-4xl font-bold text-white">Move</h1>
  </div>

  <!-- Formulário -->
  <div class="px-6 pt-8">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">
      Crie sua conta
    </h2>

    <form action="/api/auth/register" method="POST" class="space-y-6">
      <!-- Nome -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Nome completo
        </label>
        <input
          name="name"
          type="text"
          class="w-full p-3 border border-gray-300 rounded-lg"
          placeholder="Digite seu nome"
          required
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          name="email"
          type="email"
          class="w-full p-3 border border-gray-300 rounded-lg"
          placeholder="Digite seu email"
          required
        />
      </div>

      <!-- Celular -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Celular
        </label>
        <input
          name="phone"
          type="tel"
          class="w-full p-3 border border-gray-300 rounded-lg"
          placeholder="(00) 00000-0000"
          required
        />
      </div>

      <!-- Senha -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Senha
        </label>
        <input
          name="password"
          type="password"
          class="w-full p-3 border border-gray-300 rounded-lg"
          placeholder="Crie uma senha"
          required
        />
      </div>

      <!-- Termos -->
      <div class="flex items-start space-x-2">
        <input
          name="terms"
          type="checkbox"
          class="mt-1 focus:ring-primary text-primary border-gray-300 rounded"
          required
        />
        <p class="text-sm text-gray-600">
          Li e aceito os
          <a href="/terms" class="text-primary font-medium">Termos de Uso</a>
          e
          <a href="/privacy" class="text-primary font-medium">Política de Privacidade</a>
        </p>
      </div>

      <!-- Botão Registrar -->
      <button
        type="submit"
        class="w-full bg-primary text-white py-3 rounded-lg font-medium"
      >
        Criar conta
      </button>

      <!-- Login -->
      <p class="text-center text-gray-600">
        Já tem uma conta?
        <a href="/login" class="text-primary font-medium">
          Faça login
        </a>
      </p>
    </form>
  </div>
</body>
</html>

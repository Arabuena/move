services:
  - name: move-app
    type: web
    env: node
    plan: starter
    buildCommand: |
      cd frontend && yarn install --production=false && yarn build && yarn export
      cd ../backend && yarn install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGO_URI
        fromGroup: move-app
      - key: JWT_SECRET
        fromGroup: move-app
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        fromGroup: move-app
    healthCheckPath: /api/hello
    autoDeploy: true

  - name: move-frontend
    type: static
    buildCommand: cd frontend && yarn install && yarn build && yarn export
    publishDir: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://move-k987.onrender.com/api
      - key: NODE_ENV
        value: production
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    domains:
      - move-k987.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://move-k987.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html 
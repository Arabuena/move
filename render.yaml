services:
  - name: move-app
    type: web
    env: node
    plan: starter
    buildCommand: |
      cd frontend && yarn install --production=false && yarn build
      cd ../backend && yarn install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: NEXT_PUBLIC_API_URL
        value: https://move-k987.onrender.com/api
      - key: MONGO_URI
        fromGroup: move-app
      - key: JWT_SECRET
        fromGroup: move-app
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        fromGroup: move-app
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://move-k987.onrender.com https://*.googleapis.com; frame-src 'self' https://*.googleapis.com"

    healthCheckPath: /api/hello
    autoDeploy: true

  - type: web
    name: move-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://move-k987.onrender.com/api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html 
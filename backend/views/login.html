<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#520578'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white">
  <!-- Header com Logo -->
  <div class="bg-primary h-48 rounded-b-[40px] flex items-center justify-center">
    <h1 class="text-4xl font-bold text-white">Move</h1>
  </div>

  <!-- Formulário -->
  <div class="px-6 pt-8">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">
      Bem-vindo de volta
    </h2>

    <form action="/api/auth/login" method="POST" class="space-y-6">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          name="email"
          type="email"
          class="w-full p-3 border border-gray-300 rounded-lg"
          placeholder="Seu email"
          required
        />
      </div>

      <!-- Senha -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Senha
        </label>
        <input
          name="password"
          type="password"
          class="w-full p-3 border border-gray-300 rounded-lg"
          placeholder="Sua senha"
          required
        />
      </div>

      <!-- Botão Entrar -->
      <button
        type="submit"
        class="w-full bg-primary text-white py-3 rounded-lg font-medium"
      >
        Entrar
      </button>

      <!-- Criar conta -->
      <p class="text-center text-gray-600">
        Não tem uma conta?
        <a href="/register" class="text-primary font-medium">
          Registre-se
        </a>
      </p>
    </form>
  </div>
</body>
</html>

services:
  - name: move-app
    type: web
    env: node
    plan: starter
    buildCommand: |
      cd frontend && yarn install && yarn build
      cd ../backend && yarn install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: NEXT_PUBLIC_API_URL
        value: https://move-app.onrender.com/api
      - key: MONGO_URI
        sync: false  # Configurar manualmente no dashboard
      - key: JWT_SECRET
        value: move_jwt_secret_2024  # Em produção, use um valor mais seguro
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        value: AIzaSyAVe7W-B0zZa-6ePrcLfZkDzs1RGRSHSCc

    healthCheckPath: /api/hello
    autoDeploy: true 
services:
  # Backend API em https://move-app.onrender.com
  - name: move-app
    type: web
    env: node
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGO_URI
        fromGroup: move-app
      - key: JWT_SECRET
        fromGroup: move-app
      - key: FRONTEND_URL
        value: https://move-k987.onrender.com
      - key: BACKEND_URL
        value: https://move-app.onrender.com
    healthCheckPath: /api/hello
    autoDeploy: true
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Access-Control-Allow-Methods
        value: "GET,PUT,POST,DELETE,OPTIONS"
      - path: /*
        name: Access-Control-Allow-Headers
        value: "Content-Type, Authorization, Content-Length, X-Requested-With"

  # Frontend estático em https://move-k987.onrender.com
  - name: move-frontend
    type: static
    buildCommand: cd frontend && yarn install && yarn build && yarn export
    publishDir: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://move-app.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /_next/static/*.js
        name: Content-Type
        value: application/javascript
      - path: /_next/static/*.css
        name: Content-Type
        value: text/css
      - path: /_next/static/*.woff2
        name: Content-Type
        value: font/woff2
    domains:
      - move-k987.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://move-k987.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html 
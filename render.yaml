services:
  - name: move-app
    type: web
    env: node
    plan: starter
    buildCommand: |
      cd frontend && yarn install --production=false && yarn build
      cd ../backend && yarn install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGO_URI
        fromGroup: move-app
      - key: JWT_SECRET
        fromGroup: move-app
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        fromGroup: move-app
    healthCheckPath: /api/hello
    autoDeploy: true

  - name: move-frontend
    type: web
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://move-k987.onrender.com/api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    domains:
      - move-k987.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://move-k987.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html 